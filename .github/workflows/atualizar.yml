name: Atualizar notícias e cotações

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar notícias e cotações
        run: python3 atualizar.py
      - name: Salvar no site
        run: |
          git config user.name "meu-bolso-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || (git commit -m "Atualiza notícias e cotações" && git push)
